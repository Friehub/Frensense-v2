[package]
name = "frensense-engine"
version = "0.10.0"
authors = ["Friehub Developers"]
edition = "2024"
description = "Frensense engine core - IR lowering, value-flow analysis, interprocedural taint, and policy checks"
license = "GPL-3.0-only"
readme = "README.md"
repository = "https://github.com/Friehub/Frensense-v2"
documentation = "https://frensense.friehub.cloud"
rust-version = "1.95"

[lib]
name = "frensense_engine"

[lints]
workspace = true

[dependencies]
frensense-lang = { path = "../frensense-lang", version = "0.9.0" }

tree-sitter = "0.23"
tree-sitter-rust = { version = "0.23", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-javascript = { version = "0.23", optional = true }
tree-sitter-python = { version = "0.23", optional = true }
rustc-hash = "1.1"
serde = { version = "1.0", features = ["derive"], optional = true }

[features]
default = ["rust", "typescript", "full-analysis"]
rust = ["dep:tree-sitter-rust"]
typescript = ["dep:tree-sitter-typescript", "dep:tree-sitter-javascript"]
python = ["dep:tree-sitter-python"]
# Compatibility no-op: HTML has no provider in `frensense-lang`, so this
# feature never selected a grammar the engine could use.
html = []
serialize = ["dep:serde"]
full-analysis = []

# These optional dependencies are selected by downstream language-feature
# names but their grammar crates are consumed by frensense-lang, not this crate.
[package.metadata.cargo-machete]
ignored = [
    "tree-sitter-rust",
    "tree-sitter-typescript",
    "tree-sitter-javascript",
    "tree-sitter-python",
]

[dev-dependencies]
frensense-packgen = { path = "../frensense-packgen" }
# The `.frc` payload codec: the library only needs the serde derives, so this
# is test-only (round-trip tests for the learned-fact vocabulary).
bincode = "1"
