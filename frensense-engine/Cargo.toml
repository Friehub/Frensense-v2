[package]
name = "frensense-engine"
version = "0.8.0"
authors = ["Friehub Developers"]
edition = "2024"
description = "Frensense engine core - IR lowering, value-flow analysis, interprocedural taint, and policy checks"
license = "GPL-3.0-only"
readme = "../README.md"
repository = "https://github.com/Friehub/Frensense-v2"
homepage = "https://frensense.friehub.cloud"
documentation = "https://frensense.friehub.cloud"
rust-version = "1.95"

[lib]
name = "frensense_engine"

[dependencies]
frensense-lang = { path = "../frensense-lang", version = "0.8.0" }

tree-sitter = "0.23"
tree-sitter-rust = { version = "0.23", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-javascript = { version = "0.23", optional = true }
tree-sitter-python = { version = "0.23", optional = true }
tree-sitter-html = { version = "0.23", optional = true }
rustc-hash = "1.1"
serde = { version = "1.0", features = ["derive"], optional = true }
bincode = { version = "1", optional = true }

[features]
default = ["rust", "typescript", "full-analysis"]
rust = ["dep:tree-sitter-rust"]
typescript = ["dep:tree-sitter-typescript", "dep:tree-sitter-javascript"]
python = ["dep:tree-sitter-python"]
html = ["dep:tree-sitter-html"]
serialize = ["dep:serde", "dep:bincode"]
full-analysis = []

# These optional dependencies are selected by downstream language-feature
# names but their grammar crates are consumed by frensense-lang, not this crate.
# bincode is used by serialization test helpers.
[package.metadata.cargo-machete]
ignored = [
    "tree-sitter-rust",
    "tree-sitter-typescript",
    "tree-sitter-javascript",
    "tree-sitter-python",
    "tree-sitter-html",
]

[dev-dependencies]
frensense-packgen = { path = "../frensense-packgen" }
