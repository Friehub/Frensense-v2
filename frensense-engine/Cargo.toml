[package]
name = "frensense-engine"
version = "0.7.0-preview.5"
authors = ["Friehub Developers"]
edition = "2024"
description = "Frensense engine core - structural code analysis primitives (fingerprints, profiles, semantic graph, taint, temporal events)"
license = "GPL-3.0-only"
readme = "../README.md"
repository = "https://github.com/Friehub/Frensense-v2"
homepage = "https://frensense.friehub.cloud"
documentation = "https://frensense.friehub.cloud"
rust-version = "1.95"

[lib]
name = "frensense_engine"

[dependencies]
frensense-lang = { path = "../frensense-lang", version = "0.7.0-preview.5" }

tree-sitter = "0.23"
tree-sitter-rust = { version = "0.23", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-javascript = { version = "0.23", optional = true }
tree-sitter-python = { version = "0.23", optional = true }
tree-sitter-html = { version = "0.23", optional = true }
rustc-hash = "1.1"
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
bincode = { version = "1", optional = true }
blake3 = { version = "1.5", optional = true }

[features]
default = ["rust", "typescript", "full-analysis"]
rust = ["dep:tree-sitter-rust"]
typescript = ["dep:tree-sitter-typescript", "dep:tree-sitter-javascript"]
python = ["dep:tree-sitter-python"]
html = ["dep:tree-sitter-html"]
serialize = ["dep:serde", "dep:serde_json", "dep:bincode", "dep:blake3"]
full-analysis = []

