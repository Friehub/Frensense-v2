# The repositories the benchmark suites scan. Adding a repo is an edit to this file only:
# no Python changes, and a new entry shows up in `--only`, the history sheet and the challenge board.
#
# Every entry pins a full 40-character commit SHA (a tag's SHA is fine). Moving a pin moves the
# baseline, so do it on purpose and say so in the commit.
#
#   name      unique short name; used by --only and as the challenge repo name
#   url       git URL
#   commit    full 40-char SHA
#   lang      python | javascript | typescript | c | rust | go
#   targets   paths scanned in ONE invocation (so the cross-file call graph links them)
#   note      why this repo is here
#   timeout   optional per-repo scan limit in seconds (the default is 1800)
#   suites    which suites scan it: "blindness" (blind-spot challenges) and/or "real"
#             (timing, peak RSS and findings). Default: both.
#
# C and Rust entries are here for the memory side as much as the blindness side:
# pointer-heavy code is where peak RSS and the truncation caps move.

[[repo]]
name = "flask"
url = "https://github.com/pallets/flask.git"
commit = "d086db856be187255b8ec61ef409357393020f32"
lang = "python"
targets = ["src"]
note = "Python microframework; dynamic WSGI request routing"

