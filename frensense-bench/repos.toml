# Apps whose flaws are known. These score the engine against ground truth (missed bugs and
# false alarms) instead of only counting unknown sinks. `labels` picks how the ground truth is read:
#   juice     vuln-line markers in the source
#   owasp     the benchmark's expected-results CSV (file-level labels)
#   anchored  frensense-bench/labels/<name>.json
# `per_file = true` scans one file per process, as the benchmark suite defines its cases.
# The recent-CVE set lives in labels/recent_cves.json, which carries its own pins.

[[labelled]]
name = "juice-shop"
url = "https://github.com/juice-shop/juice-shop.git"
commit = "717f5efa886b0417eeecb52378b03cf10567b7e2"
lang = "typescript"
targets = ["routes", "lib", "models"]
labels = "juice"

[[labelled]]
name = "nodegoat"
url = "https://github.com/OWASP/NodeGoat.git"
commit = "c5cb68a7084e4ae7dcc60e6a98768720a81841e8"
lang = "javascript"
targets = ["app"]
labels = "anchored"

[[labelled]]
name = "owasp-python"
url = "https://github.com/OWASP-Benchmark/BenchmarkPython.git"
commit = "f1291485808b66e20ddb6b01b10dc71b3df8c8ba"
lang = "python"
targets = ["testcode"]
labels = "owasp"
per_file = true
