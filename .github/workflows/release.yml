name: Release

# Gated on a green CI run for the exact commit, never racing it. The old
# trigger (`push: branches: [main]`) built and published four crates from a
# pipeline that never looked at CI; this one is invoked only after the CI
# workflow concludes successfully for the commit being released, or by hand
# for an already-green commit.
on:
  workflow_run:
    workflows: ['FrenSense CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.2.1)'
        required: false

concurrency:
  group: release-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # -1. Gate: only run after a *successful* CI run for the same commit.
  gate:
    name: CI Gate
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.16.1
        with:
          egress-policy: audit
      - name: Resolve the commit being released
        id: resolve
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            SHA="${{ github.event.workflow_run.head_sha }}"
          else
            SHA="${{ github.sha }}"
          fi
          echo "Resolved release commit: $SHA"
          echo "sha=$SHA" >> $GITHUB_OUTPUT

  # 0. Prepare: Decide if we should release and ensure tags exist
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    needs: gate
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      tag_name: ${{ steps.check.outputs.tag_name }}
      version: ${{ steps.check.outputs.version }}
      identity: ${{ steps.identity.outputs.identity }}
      pending: ${{ steps.matrix.outputs.pending }}
      pending_count: ${{ steps.matrix.outputs.pending_count }}
      # Only `prepare` depends on `gate`; downstream jobs read the SHA here.
      sha: ${{ needs.gate.outputs.sha }}
    permissions:
      contents: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.16.1
        with:
          egress-policy: audit

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v4.3.0
        with:
          fetch-depth: 0
          ref: ${{ needs.gate.outputs.sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2.8.1
        with:
          workspaces: '. -> target'

      # Frensense ships four registry crates, each with its own version. This
      # records which of them are still missing from crates.io, so a
      # crate-only release (no new `vX.Y.Z`) still publishes instead of being
      # read as "root version unchanged, nothing to do". Runs after Rust is
      # installed because it asks `cargo metadata` for the publishable set.
      - name: Per-crate version matrix
        id: matrix
        run: python3 .github/scripts/release-matrix.py --github-output "$GITHUB_OUTPUT"

      - name: Check version and tags
        id: check
        run: |
          PENDING_COUNT="${{ steps.matrix.outputs.pending_count }}"
          PENDING_COUNT="${PENDING_COUNT:-0}"
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          TAG="v$VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Pending crate publications: $PENDING_COUNT (${{ steps.matrix.outputs.pending }})"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            RAW="${{ github.event.inputs.tag }}"
            if [[ -n "$RAW" ]]; then
              RAW="${RAW#v}"
              TAG="v$RAW"
            fi
          fi

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            TAG_SHA=$(git rev-list -n1 "$TAG")
            echo "Tag $TAG already exists at $TAG_SHA."
            if [[ "$PENDING_COUNT" -gt 0 ]]; then
              # Crates moved after the binary was tagged: publish them without
              # creating or moving a tag.
              echo "Releasing publishable crates without a new tag."
              echo "should_release=true" >> $GITHUB_OUTPUT
              echo "tag_name=" >> $GITHUB_OUTPUT
            else
              echo "Nothing new to publish or tag."
              echo "should_release=false" >> $GITHUB_OUTPUT
              echo "tag_name=" >> $GITHUB_OUTPUT
            fi
          else
            echo "New version $VERSION detected. Tag $TAG will be created."
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "tag_name=$TAG" >> $GITHUB_OUTPUT
          fi

      # Pre-publish assertion: build the binary and require `--version --json`
      # to report exactly the version we are about to tag and publish. Catches
      # a tag/manifest mismatch before four crates are pushed to crates.io.
      - name: Assert build identity matches the release version
        id: identity
        if: steps.check.outputs.should_release == 'true'
        run: |
          cargo build --bin frensense
          IDENTITY_JSON=$(./target/debug/frensense --version --json)
          echo "$IDENTITY_JSON"
          REPORTED=$(echo "$IDENTITY_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')
          EXPECTED="${{ needs.check.outputs.version }}"
          if [[ "$REPORTED" != "$EXPECTED" ]]; then
            echo "::error::Binary reports version '$REPORTED' but the release tag expects '$EXPECTED'. Refusing to release."
            exit 1
          fi
          echo "identity=$(echo "$IDENTITY_JSON" | base64 -w0)" >> $GITHUB_OUTPUT

      - name: Create annotated tag with artifact identity
        if: >-
          steps.check.outputs.should_release == 'true' &&
          github.event_name == 'workflow_run' &&
          steps.check.outputs.tag_name != ''
        env:
          IDENTITY_B64: ${{ steps.identity.outputs.identity }}
        run: |
          TAG="${{ needs.check.outputs.tag_name }}"
          VERSION="${{ needs.check.outputs.version }}"
          IDENTITY=$(echo "$IDENTITY_B64" | base64 -d)
          VOCAB=$(echo "$IDENTITY" | python3 -c 'import json,sys; print(json.load(sys.stdin)["fact_vocabulary_fingerprint"])')
          BUNDLE_FMT=$(echo "$IDENTITY" | python3 -c 'import json,sys; print(json.load(sys.stdin)["bundle_format"])')
          PACK=$(echo "$IDENTITY" | python3 -c 'import json,sys; print(json.load(sys.stdin)["default_pack"]["blake3"])')
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "frensense $VERSION

          bundle_format: $BUNDLE_FMT
          fact_vocabulary: $VOCAB
          default_pack_blake3: $PACK"
          git push origin "$TAG"
          echo "Annotated tag $TAG created with artifact identity."

  # 1. Build Native Artifacts for all platforms
  build-native:
    name: Build Native (${{ matrix.settings.target }})
    needs: prepare
    # Binaries only ship with a new `vX.Y.Z`. A crate-only release publishes to
    # crates.io and leaves the existing tag and release assets untouched.
    if: >-
      needs.prepare.outputs.should_release == 'true' &&
      needs.prepare.outputs.tag_name != ''
    runs-on: ${{ matrix.settings.host }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: frensense
            ext: ''
          - host: macos-latest
            target: x86_64-apple-darwin
            bin_name: frensense
            ext: ''
          - host: macos-14
            target: aarch64-apple-darwin
            bin_name: frensense
            ext: ''
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: frensense.exe
            ext: .exe

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.16.1
        with:
          egress-policy: audit

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v4.3.0
        with:
          ref: ${{ needs.prepare.outputs.tag_name }}

      - name: Setup Node
        uses: actions/setup-node@f1f314fca9dfce2769ece7d933488f076716723e # v4.4.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable
          targets: ${{ matrix.settings.target }}


      - name: Build binary (CLI + MCP + LSP unified)
        shell: bash
        run: cargo build --release --target ${{ matrix.settings.target }} --bin frensense

      - name: Build FRC Bundle
        # The corpus is proprietary and not in the public repo; skip unless
        # corpus/targets exists (private release runners only).
        if: matrix.settings.host == 'ubuntu-latest' && hashFiles('corpus/targets/**') != ''
        run: cargo run --release -p frensense-bundler --bin frensense-bundler -- -c corpus/targets -o frensense-corpus.frc

      - name: Upload FRC Artifact
        if: matrix.settings.host == 'ubuntu-latest' && hashFiles('corpus/targets/**') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frensense-corpus
          path: frensense-corpus.frc

      - name: Smoke test CLI binary
        shell: bash
        run: |
          binary="target/${{ matrix.settings.target }}/release/${{ matrix.settings.bin_name }}"
          file "$binary" || true
          "$binary" --version
          "$binary" --help
          echo 'fn main() { let x = 1; }' > test_smoke.rs
          "$binary" test_smoke.rs --json > /dev/null
          rm -f test_smoke.rs
          echo "CLI smoke test passed"

      - name: Smoke test MCP server
        shell: bash
        run: |
          binary="target/${{ matrix.settings.target }}/release/${{ matrix.settings.bin_name }}"
          python3 - "$binary" <<'PYEOF'
          import json, subprocess, sys
          binary = sys.argv[1]
          reqs = "\n".join([
              json.dumps({"jsonrpc": "2.0", "id": 1, "method": "initialize", "params": {}}),
              json.dumps({"jsonrpc": "2.0", "id": 2, "method": "tools/list", "params": {}}),
              json.dumps({"jsonrpc": "2.0", "id": 3, "method": "exit"}),
          ]) + "\n"
          proc = subprocess.run([binary, "mcp"], input=reqs.encode(), capture_output=True, timeout=30)
          out = proc.stdout.decode("utf-8", errors="replace")
          assert "frensense-mcp" in out, f"initialize response missing serverInfo: {out}"
          assert "frensense_scan_file" in out, f"tools/list missing frensense_scan_file: {out}"
          assert "frensense_diff" in out, f"tools/list missing frensense_diff: {out}"
          print("MCP smoke test passed")
          PYEOF

      - name: Smoke test LSP server
        shell: bash
        run: |
          binary="target/${{ matrix.settings.target }}/release/${{ matrix.settings.bin_name }}"
          python3 - "$binary" <<'PYEOF'
          import json, subprocess, sys
          binary = sys.argv[1]
          def frame(obj):
              body = json.dumps(obj).encode()
              return b"Content-Length: %d\r\n\r\n" % len(body) + body
          msgs = b"".join([
              frame({"jsonrpc": "2.0", "id": 1, "method": "initialize", "params": {}}),
              frame({"jsonrpc": "2.0", "method": "exit"}),
          ])
          out = subprocess.run([binary, "lsp"], input=msgs, capture_output=True, timeout=30).stdout
          assert b"frensense-lsp" in out, "initialize response missing serverInfo"
          print("LSP smoke test passed")
          PYEOF

      - name: Upload CLI Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-${{ matrix.settings.target }}
          path: target/${{ matrix.settings.target }}/release/${{ matrix.settings.bin_name }}



  # 2. Generate Hashes for SLSA
  generate-hashes:
    name: Generate Hashes
    runs-on: ubuntu-latest
    needs: [prepare, build-native]
    permissions:
      contents: read
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.16.1
        with:
          egress-policy: audit
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
      - name: Generate hashes
        id: hash
        run: |
          cd artifacts
          find . -type f | xargs sha256sum | base64 -w0 > hashes.txt
          echo "hashes=$(cat hashes.txt)" >> $GITHUB_OUTPUT

  # 3. SLSA Provenance
  provenance:
    needs: [prepare, generate-hashes]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.generate-hashes.outputs.hashes }}
      upload-assets: true

  # 4. Publish to Crates.io
  publish-cargo:
    name: Publish to Crates.io
    runs-on: ubuntu-latest
    # Deliberately does not wait on build-native: a crate-only release has no
    # new binary to build, and a skipped dependency would silently skip this
    # job - which is exactly the skip we are guarding against.
    needs: [prepare]
    # Publish exactly when a crate's manifest version is not on crates.io yet;
    # `prepare` decided that set, and the post-publish assertion below fails if
    # any of it did not actually land.
    if: >-
      needs.prepare.outputs.should_release == 'true' &&
      needs.prepare.outputs.pending_count != '0'
    environment: production
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.16.1
        with:
          egress-policy: audit
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v4.3.0
        with:
          # The tag (when there is one) points at this commit; checking out the
          # SHA keeps crate-only releases working with no tag at all.
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable
      - name: Install cargo-smart-release
        run: cargo install cargo-smart-release --locked
      - name: Install cargo-semver-checks
        run: cargo install cargo-semver-checks --locked
      - name: Per-crate SemVer assertion against the published baseline
        # Every crate about to ship must already carry a version that covers
        # its public-API change. `check-release` compares each publishable
        # crate against its latest crates.io release and skips a crate that
        # moved its middle number (the bump absorbs the break).
        run: python3 .github/scripts/semver-gate.py --published
      - name: Publish workspace crates in dependency order
        # cargo-smart-release replaces the old hand-rolled publish loop
        # (curl + `sleep 35` + `cargo publish --allow-dirty`). It resolves
        # the dependency graph, publishes lang -> engine -> bundler -> frensense
        # in topological order, and waits on the crates.io index properly.
        #
        # Strictness:
        #   - No `--allow-dirty`: a clean tag checkout is required; smart-release
        #     refuses to publish from a dirty tree.
        #   - `--bump keep --bump-dependencies keep`: versions are set by hand in
        #     the manifests (the `chore(release)` commit); we publish exactly those.
        #   - `--no-changelog`: the curated per-crate CHANGELOG.md files are
        #     preserved verbatim, not regenerated from commits.
        #   - `--no-tag --no-push`: the `prepare` job already created the release
        #     tag; this job only publishes.
        #   - `frensense-packgen` / `frensense-devtools` are `publish = false`
        #     and are skipped automatically.
        #
        # Every publishable crate is named explicitly, in dependency order. Naming
        # only `frensense` let smart-release decide whether its path dependencies
        # needed publishing; naming them all makes the set this run may publish
        # visible in the log, and `--bump keep` still publishes exactly the
        # manifest versions (an already-published version is a no-op).
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo smart-release --execute \
            --bump keep --bump-dependencies keep \
            --no-changelog --no-changelog-preview --no-changelog-github-release \
            --no-tag --no-push \
            frensense-lang frensense-engine frensense-bundler frensense

      - name: Assert every publishable crate is on crates.io
        # A release is not done when the named crate publishes: each crate
        # versions independently, so a skipped one (an unbuilt dependency, a
        # stale registry token, a version that never moved) has to fail here
        # rather than be discovered by a user installing the crate later.
        # crates.io indexing is asynchronous, hence the bounded poll.
        run: python3 .github/scripts/release-matrix.py --require-published --wait 420

  # 5. Publish to NPM
  publish-npm:
    name: Publish to NPM (@friehub/frensense)
    runs-on: ubuntu-latest
    needs: [prepare, build-native]
    # npm ships the binary, so it only moves with a new `vX.Y.Z` tag.
    if: needs.prepare.outputs.tag_name != ''
    environment: production
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.16.1
        with:
          egress-policy: audit

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v4.3.0
        with:
          ref: ${{ needs.prepare.outputs.tag_name }}

      - name: Setup Node
        uses: actions/setup-node@f1f314fca9dfce2769ece7d933488f076716723e # v4.4.0
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Prepare NPM package
        run: |
          mkdir -p npm/dist/binaries
          cp artifacts/cli-x86_64-unknown-linux-gnu/frensense    ./npm/dist/binaries/frensense-linux-x64
          cp artifacts/cli-x86_64-apple-darwin/frensense          ./npm/dist/binaries/frensense-macos-x64
          cp artifacts/cli-aarch64-apple-darwin/frensense          ./npm/dist/binaries/frensense-macos-arm64
          cp artifacts/cli-x86_64-pc-windows-msvc/frensense.exe   ./npm/dist/binaries/frensense-windows-x64.exe
          chmod +x ./npm/dist/binaries/* ./npm/bin/frensense.js
          cp README.md ./npm/README.md 2>/dev/null || true

      - name: Test NPM package before publish
        run: |
          cd npm
          npm pack
          TESTDIR=$(mktemp -d)
          cd "$TESTDIR"
          npm init -y > /dev/null
          npm install "$GITHUB_WORKSPACE"/npm/friehub-frensense-*.tgz
          ./node_modules/.bin/frensense --version
          echo 'fn main() { let x = 1; }' > test.rs
          ./node_modules/.bin/frensense test.rs --json > /dev/null
          echo 'NPM package smoke test passed.'

      - name: Check version and publish tag
        id: npm_meta
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          cd npm
          npm version "$VERSION" --no-git-tag-version --allow-same-version

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://registry.npmjs.org/@friehub/frensense/$VERSION")
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "Version $VERSION already exists on NPM. Skipping."
            echo "already_published=true" >> $GITHUB_OUTPUT
          else
            echo "Version $VERSION not found on NPM. Will publish."
            echo "already_published=false" >> $GITHUB_OUTPUT
          fi

          if [[ "$VERSION" =~ (alpha|beta|preview|rc) ]]; then
            echo "npm_tag=preview" >> $GITHUB_OUTPUT
          else
            echo "npm_tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Publish to NPM
        if: steps.npm_meta.outputs.already_published != 'true'
        run: |
          cd npm
          npm publish --tag ${{ steps.npm_meta.outputs.npm_tag }} --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # 6. Create GitHub Release
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [prepare, build-native, provenance]
    # A crate-only release has no tag and no assets to publish.
    if: needs.prepare.outputs.tag_name != ''
    environment: production
    permissions:
      contents: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.16.1
        with:
          egress-policy: audit
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v4.3.0
        with:
          ref: ${{ needs.prepare.outputs.tag_name }}
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
      - name: Prepare binaries for release
        run: |
          mkdir -p release-binaries
          # CLI
          for dir in artifacts/cli-*/; do
            target=$(basename "$dir" | sed 's/cli-//')
            ext=""
            if [[ "$target" == *"windows"* ]]; then ext=".exe"; fi
            cp "${dir}frensense${ext}" "release-binaries/frensense-${target}${ext}"
          done
          # Include SLSA provenance attestation if generated
          find artifacts -name "*.intoto.jsonl" -exec cp {} release-binaries/ \; 2>/dev/null || true
      - name: Release
        uses: softprops/action-gh-release@26994186c0ac3ef5cae75ac16aa32e8153525f77 # v2.4.2
        with:
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          files: release-binaries/*
          generate_release_notes: true
          prerelease: ${{ contains(needs.prepare.outputs.tag_name, 'preview') || contains(needs.prepare.outputs.tag_name, 'alpha') || contains(needs.prepare.outputs.tag_name, 'beta') || contains(needs.prepare.outputs.tag_name, 'rc') }}

