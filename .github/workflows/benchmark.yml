name: Vulnerability Benchmark

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: Run Vulnerability Recall Benchmark
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.16.1
        with:
          egress-policy: audit

      - name: Checkout Frensense
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v4.3.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2.8.1

      - name: Build Frensense
        run: cargo build --release

      - name: Run Reproducible Benchmark
        env:
          GITHUB_TOKEN: ${{ secrets.GIST_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/reproduce_benchmark.sh --workers 8 --publish-gist

          # Append Markdown report directly to GitHub Actions summary
          cat benchmark_report.md >> $GITHUB_STEP_SUMMARY

          # Convert scorecard into benchmark-action custom format
          python3 -c "
          import json
          with open('benchmark_scorecard.json') as f:
              scorecard = json.load(f)
          total = scorecard['total']
          data = [
              {'name': 'OWASP Benchmark Score (TPR - FPR)', 'value': round(total['score'] * 100, 1), 'unit': '%'},
              {'name': 'OWASP Benchmark True Positive Rate (TPR)', 'value': round(total['tpr'] * 100, 1), 'unit': '%'},
              {'name': 'OWASP Benchmark False Positive Rate (FPR)', 'value': round(total['fpr'] * 100, 1), 'unit': '%'},
              {'name': 'OWASP Benchmark True Positives (TP)', 'value': total['TP'], 'unit': 'cases'},
              {'name': 'OWASP Benchmark False Positives (FP)', 'value': total['FP'], 'unit': 'cases'}
          ]
          with open('benchmark-results.json', 'w') as f:
              json.dump(data, f, indent=2)
          "

          cat benchmark-results.json

      - name: Upload Benchmark Scorecard Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frensense-benchmark-scorecard
          path: |
            benchmark_report.md
            benchmark_scorecard.json

      - name: Store and Publish Benchmark Results
        uses: benchmark-action/github-action-benchmark@315072f079db10e96004ffb95b9b7263bf3a547e # v1.19.2
        with:
          tool: 'customBiggerIsBetter'
          output-file-path: benchmark-results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          comment-on-alert: true
          fail-on-alert: false
          summary-always: true
