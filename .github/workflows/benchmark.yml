name: Vulnerability Benchmark

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: Run Vulnerability Recall Benchmark
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.16.1
        with:
          egress-policy: audit

      - name: Checkout Frensense
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v4.3.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable
      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2.8.1

      - name: Build Frensense
        run: cargo build --release

      - name: Checkout OWASP BenchmarkPython
        run: git clone --depth 1 https://github.com/OWASP-Benchmark/BenchmarkPython.git /tmp/BenchmarkPython

      - name: Run OWASP Python Benchmark
        run: |
          python3 scripts/owasp_benchmark.py \
            --owasp-csv /tmp/BenchmarkPython/expectedresults-0.1.csv \
            --owasp-testcode /tmp/BenchmarkPython/testcode \
            --json-out /tmp/owasp_scorecard.json | tee /tmp/owasp_summary.txt

          echo "## OWASP Benchmark for Python Results" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat /tmp/owasp_summary.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          python3 -c "
          import json
          with open('/tmp/owasp_scorecard.json') as f:
              scorecard = json.load(f)
          total = scorecard['total']
          data = [
              {'name': 'OWASP Benchmark Score (TPR - FPR)', 'value': round(total['score'] * 100, 1), 'unit': '%'},
              {'name': 'OWASP Benchmark True Positive Rate (TPR)', 'value': round(total['tpr'] * 100, 1), 'unit': '%'},
              {'name': 'OWASP Benchmark False Positive Rate (FPR)', 'value': round(total['fpr'] * 100, 1), 'unit': '%'},
              {'name': 'OWASP Benchmark True Positives (TP)', 'value': total['TP'], 'unit': 'cases'},
              {'name': 'OWASP Benchmark False Positives (FP)', 'value': total['FP'], 'unit': 'cases'}
          ]
          with open('benchmark-results.json', 'w') as f:
              json.dump(data, f, indent=2)
          "

          cat benchmark-results.json

      - name: Store and Publish Benchmark Results
        uses: benchmark-action/github-action-benchmark@315072f079db10e96004ffb95b9b7263bf3a547e # v1.19.2
        with:
          tool: 'customBiggerIsBetter'
          output-file-path: benchmark-results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          comment-on-alert: true
          fail-on-alert: false
          summary-always: true
