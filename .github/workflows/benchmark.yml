name: Vulnerability Benchmark

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

# Same group as the docs deploy: both push to gh-pages and must not race.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  benchmark:
    name: Run Vulnerability Recall Benchmark
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.16.1
        with:
          egress-policy: audit

      - name: Checkout Frensense
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v4.3.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2.8.1

      - name: Build Frensense
        run: cargo build --release

      - name: Run Reproducible Benchmark
        env:
          GITHUB_TOKEN: ${{ secrets.GIST_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python3 frensense-bench/run.py --suite owasp --workers 8 --publish-gist

          # Append Markdown report directly to GitHub Actions summary
          cat benchmark_report.md >> $GITHUB_STEP_SUMMARY

          # Convert scorecard into benchmark-action custom format
          python3 -c "
          import json
          with open('benchmark_scorecard.json') as f:
              scorecard = json.load(f)
          total = scorecard['total']
          data = [
              {'name': 'OWASP Benchmark Score (TPR - FPR)', 'value': round(total['score'] * 100, 1), 'unit': '%'},
              {'name': 'OWASP Benchmark True Positive Rate (TPR)', 'value': round(total['tpr'] * 100, 1), 'unit': '%'},
              {'name': 'OWASP Benchmark False Positive Rate (FPR)', 'value': round(total['fpr'] * 100, 1), 'unit': '%'},
              {'name': 'OWASP Benchmark True Positives (TP)', 'value': total['TP'], 'unit': 'cases'},
              {'name': 'OWASP Benchmark False Positives (FP)', 'value': total['FP'], 'unit': 'cases'}
          ]
          with open('benchmark-results.json', 'w') as f:
              json.dump(data, f, indent=2)
          "

          cat benchmark-results.json

      - name: Prepare published scorecard
        # The full scorecard carries per-case verdicts (large). The page only
        # needs provenance, totals and the per-CWE breakdown.
        run: |
          python3 -c "
          import json
          with open('benchmark_scorecard.json') as f:
              scorecard = json.load(f)
          published = {k: scorecard[k] for k in ('meta', 'total', 'by_cwe', 'legacy_any', 'attribution') if k in scorecard}
          with open('benchmark-public.json', 'w') as out:
              json.dump(published, out, indent=1)
          "
          cat benchmark-public.json | head -40

      - name: Upload Benchmark Scorecard Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frensense-benchmark-scorecard
          path: |
            benchmark_report.md
            benchmark_scorecard.json
            benchmark-public.json

      - name: Store and Publish Benchmark Results
        uses: benchmark-action/github-action-benchmark@d48d326b4ca9ba73ca0cd0d59f108f9e02a381c7 # v1.20.4
        with:
          tool: 'customBiggerIsBetter'
          output-file-path: benchmark-results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          comment-on-alert: true
          fail-on-alert: false

      - name: Stage benchmark data for GitHub Pages
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p benchmark-site
          # The Benchmarks docs page loads this file from /benchmarks/benchmark.json.
          cp benchmark-public.json benchmark-site/benchmark.json

      - name: Deploy benchmark data (gh-pages /benchmarks)
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@329bcc8f12caed2cefe5a5b80781499a6f3b361b # v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: benchmark-site
          publish_branch: gh-pages
          destination_dir: benchmarks
          keep_files: true
