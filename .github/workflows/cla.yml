name: CLA Assistant

# Automates CLA signing for external contributions using the
# contributor-assistant GitHub Action (https://github.com/contributor-assistant/github-action).
# Signatures are stored as JSON files on the `cla-signatures` branch.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        # Run on PR open/sync, on the "recheck" comment, or when a contributor
        # posts the signing comment.
        if: |
          github.event_name == 'pull_request_target' ||
          (github.event_name == 'issue_comment' && (
            github.event.comment.body == 'recheck' ||
            contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA')
          ))
        uses: manaflow-ai/cla-github-action@v3.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A fine-grained PAT or repo GITHUB_TOKEN with contents:write on the cla-signatures branch.
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          # The CLA document contributors sign.
          path-to-document: 'https://github.com/Friehub/Frensense-v2/blob/main/CLA.md'
          # Where signed entries (login + timestamp + CLA version) are stored.
          path-to-signatures: 'signatures/cla.json'
          branch: 'cla-signatures'
          # Never block maintainers or bots.
          allowlist: 'oxisrael,0xademola,Friehub,dependabot[bot],github-actions[bot],*bot*'
          signed-commit-message: 'CLA signed by $contributorString'
          custom-notsigned-prcomment: |
            Thank you for your pull request! Before we can review and merge your contribution, please sign our [Contributor License Agreement (CLA)](https://github.com/Friehub/Frensense-v2/blob/main/CLA.md).

            You can sign the CLA by replying to this pull request with a comment containing the exact text below:

            ```text
            I have read the CLA Document and I hereby sign the CLA
            ```
          custom-allsigned-prcomment: 'CLA signed — thank you!'
