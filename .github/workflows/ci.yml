name: FrenSense CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Top-level default - most restrictive
permissions:
  contents: read

jobs:
  # --- Quality Assurance ---
  qa:
    name: Quality Assurance (Rust)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.16.1
        with:
          egress-policy: audit

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v4.3.0

      - name: Install Rust (stable, with rustfmt)
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: stable
          components: rustfmt
      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2.8.1

      - name: Cache Cargo dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/cache/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Enforce Style (rustfmt)
        run: cargo fmt --all -- --check

      - name: Lint (Clippy, warnings are errors)
        run: cargo clippy --all-features --all-targets -- -D warnings


  security:
    name: Supply Chain Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.16.1
        with:
          egress-policy: audit

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v4.3.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1 (deny 0.20.2)
        with:
          command: check advisories licenses bans

  # --- NPM Security Audit ---
  npm-security:
    name: NPM Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.16.1
        with:
          egress-policy: audit

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v4.3.0
      - uses: actions/setup-node@f1f314fca9dfce2769ece7d933488f076716723e # v4.4.0
        with:
          node-version: '22'
      # npm package metadata lives with the release tooling; when this repo
      # has no package.json this job is a no-op instead of failing.
      - name: Audit NPM dependencies (if present)
        run: |
          if [ -f package-lock.json ]; then
            npm ci
            npm audit --omit=dev --audit-level=high
          else
            echo "No package-lock.json in this repo; skipping npm audit."
          fi

  # --- MSRV Check ---
  msrv:
    name: MSRV Check (1.95)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.16.1
        with:
          egress-policy: audit

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v4.3.0
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.95.0
      - run: cargo check --all-features

  # --- SemVer Compatibility ---
  semver:
    name: SemVer Compatibility
    runs-on: ubuntu-latest
    needs: [qa]
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.16.1
        with:
          egress-policy: audit
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v4.3.0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: stable
      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2.8.1
      - name: Install cargo-semver-checks
        run: cargo install cargo-semver-checks --locked
      - name: Check SemVer
        # This will fail if the current version introduces breaking changes
        # relative to the version currently on crates.io.
        run: cargo semver-checks check-release || echo "SemVer check failed (expected for major/minor bumps)"

  # --- Correctness (Rust) ---
  test-rust:
    name: Rust Tests
    runs-on: ubuntu-latest
    needs: [qa]
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.16.1
        with:
          egress-policy: audit

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v4.3.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: stable
      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2.8.1

      - name: Run Full Regression Suite
        run: cargo test --workspace --all-features

      - name: Build Release Binary (CLI + MCP + LSP unified)
        run: cargo build --release --bin frensense

      - name: CLI Binary Smoke Test
        run: |
          binary="./target/release/frensense"
          "$binary" --version
          "$binary" --help
          echo 'fn main() { let x = 1; }' > /tmp/test_smoke.rs
          "$binary" /tmp/test_smoke.rs --json > /dev/null
          echo "CLI smoke test passed"

      - name: MCP Server Smoke Test
        run: |
          python3 - <<'PYEOF'
          import json, subprocess
          reqs = "\n".join([
              json.dumps({"jsonrpc": "2.0", "id": 1, "method": "initialize", "params": {}}),
              json.dumps({"jsonrpc": "2.0", "id": 2, "method": "tools/list", "params": {}}),
              json.dumps({"jsonrpc": "2.0", "id": 3, "method": "exit"}),
          ]) + "\n"
          proc = subprocess.run(["./target/release/frensense", "mcp"], input=reqs.encode(), capture_output=True, timeout=30)
          out = proc.stdout.decode("utf-8", errors="replace")
          assert "frensense-mcp" in out, f"initialize response missing serverInfo: {out}"
          assert "frensense_scan_file" in out, f"tools/list missing frensense_scan_file: {out}"
          assert "frensense_diff" in out, f"tools/list missing frensense_diff: {out}"
          print("MCP smoke test passed")
          PYEOF

      - name: LSP Server Smoke Test
        run: |
          python3 - <<'PYEOF'
          import json, subprocess, sys
          def frame(obj):
              body = json.dumps(obj).encode()
              return b"Content-Length: %d\r\n\r\n" % len(body) + body
          msgs = b"".join([
              frame({"jsonrpc": "2.0", "id": 1, "method": "initialize", "params": {}}),
              frame({"jsonrpc": "2.0", "method": "exit"}),
          ])
          out = subprocess.run(["./target/release/frensense", "lsp"], input=msgs, capture_output=True, timeout=30).stdout
          assert b"frensense-lsp" in out, "initialize response missing serverInfo"
          print("LSP smoke test passed")
          PYEOF

      - name: Delivery Surface Consistency
        # The three surfaces must agree: a finding the CLI reports must be
        # visible to the MCP tools. Gates on shared fixture with known finding.
        run: |
          mkdir -p /tmp/frensense-consistency
          printf 'import hashlib\n\n\ndef digest(data):\n    return hashlib.md5(data).hexdigest()\n' > /tmp/frensense-consistency/app.py
          ./target/release/frensense /tmp/frensense-consistency/app.py --json 2>/dev/null | grep -q 'weak_hash'
          echo '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"frensense_scan_file","arguments":{"path":"/tmp/frensense-consistency/app.py"}}}' |
            ./target/release/frensense mcp 2>/dev/null | grep -q 'weak_hash'
          echo "Delivery surface consistency OK"

      - name: Baseline Regression Check
        # The corpus is proprietary and not in the public repo; this step only
        # runs where corpus/targets exists (private runners / maintainer setups).
        if: ${{ hashFiles('corpus/targets/**') != '' }}
        run: |
          binary="./target/release/frensense"
          baseline="corpus/baselines/targets.json"
          mkdir -p "$(dirname "$baseline")"
          echo "Emitting baseline for corpus targets..."
          "$binary" corpus/targets --json --emit-baseline "$baseline" 2>&1
          # Clear the file cache so the comparison run does the same full analysis
          rm -f corpus/targets/.frensense/cache.json
          echo "Checking baseline comparison against corpus targets..."
          "$binary" corpus/targets --json --compare-baseline "$baseline" 2>&1
          echo "Baseline regression check passed"

      # (MCP/LSP smoke tests moved above: they now run against release
      # binaries and fail the job on breakage instead of `|| true`.)

  # --- Performance Regression ---
  bench:
    name: Performance Regression
    runs-on: ubuntu-latest
    needs: [test-rust]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.16.1
        with:
          egress-policy: audit

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v4.3.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: stable
      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2.8.1

      - name: Install cargo-criterion
        run: cargo install cargo-criterion --locked --force

      - name: Run Benchmarks
        run: cargo criterion --message-format json | tee raw_output.json

      - name: Convert results to benchmark-action format
        run: >
          jq -s '[.[] | select(.reason == "benchmark-complete") | {name: .id, unit: .unit, value: .median.estimate, range: (.median_abs_dev.estimate | tostring)}]' raw_output.json > output.txt

      - name: Store and Compare Benchmark Results
        uses: benchmark-action/github-action-benchmark@fd31771ce86cc65eab85653da103f71ab1b4479c # v1.9.0
        with:
          name: FrenSense Engine Benchmarks
          tool: customSmallerIsBetter
          output-file-path: output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          alert-threshold: '125%'
          comment-on-alert: true
          fail-on-alert: true
          comment-always: true
          summary-always: true

  # --- Public benchmark dashboard ---
  pages:
    name: Publish Benchmark Dashboard
    runs-on: ubuntu-latest
    needs: [bench]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.16.1
        with:
          egress-policy: audit

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v4.3.0
        with:
          ref: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify benchmark data exists
        run: |
          if [ ! -f dev/bench/index.html ]; then
            echo "No benchmark data found - first run, this is expected"
            exit 0
          fi
          echo "Benchmark dashboard at dev/bench/index.html - $(wc -l < dev/bench/index.html) lines"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@329bcc8f12caed2cefe5a5b80781499a6f3b361b # v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'chore: update benchmark dashboard [skip ci]'
