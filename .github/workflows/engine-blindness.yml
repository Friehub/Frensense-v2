name: Engine Blindness & Capability Benchmark

on:
  push:
    branches:
      - main
    paths:
      - 'frensense-engine/**'
      - 'frensense-lang/**'
      - 'src/**'
      - 'frensense-bench/**'
  workflow_dispatch:
    inputs:
      timeout:
        description: 'Seconds allowed per scan (blank = 1800, 0 = no limit). A scan that times out fails the run.'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

# Same group as the docs deploy: both push to gh-pages and must not race.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  blindness:
    name: Profile Engine Capability and Blindness
    runs-on: ubuntu-latest
    # GitHub's own default is 360 minutes; say it so a runaway scan is bounded on purpose.
    timeout-minutes: 240

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.16.1
        with:
          egress-policy: audit

      - name: Checkout Frensense
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v4.3.0
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2.8.1

      - name: Build Release Binary
        run: cargo build --release --bin frensense

      - name: Fetch previous challenges (to report solved ones)
        run: |
          mkdir -p target/blindness
          curl -fsSL https://frensense.friehub.cloud/blindness/challenges.json \
            -o target/blindness/previous_challenges.json || rm -f target/blindness/previous_challenges.json

      - name: Run Engine Blindness Benchmark
        env:
          # Blank on push events: the script falls back to its 1800s default.
          FRENSENSE_BLINDNESS_TIMEOUT: ${{ inputs.timeout }}
        run: |
          BASELINE=""
          if [ -f target/blindness/previous_challenges.json ]; then
            BASELINE="--baseline target/blindness/previous_challenges.json"
          fi
          python3 frensense-bench/run.py --suite blindness --prepare --run --labelled --ci-summary --max-rss-mb 1024 $BASELINE

      - name: Award credit for merged challenge fixes
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          out=target/blindness
          # The ledger is the only record of who solved what. Never start over because a fetch hiccuped:
          # 404 means "first run", anything else stops the job before the ledger is overwritten.
          code=$(curl -sS -o $out/previous_ledger.json -w '%{http_code}' https://frensense.friehub.cloud/blindness/ledger.json || echo 000)
          case "$code" in
            200) ;;
            404) rm -f $out/previous_ledger.json ;;
            *) echo "could not read the published ledger (HTTP $code); refusing to overwrite it" >&2; exit 1 ;;
          esac
          if [ -f $out/previous_challenges.json ]; then
            base=$(jq -r '.commit // empty' $out/previous_challenges.json)
            if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then range="$base..HEAD"; else range="-1"; fi
            : > $out/prs.ndjson
            for sha in $(git rev-list $range); do
              gh api "repos/$GITHUB_REPOSITORY/commits/$sha/pulls" --jq '.[] | select(.merged_at != null and .base.ref == "main")
                | {number, title, body, author: .user.login, url: .html_url, merged_at, sha: .merge_commit_sha}' >> $out/prs.ndjson
            done
            jq -s 'unique_by(.number)' $out/prs.ndjson > $out/prs.json
            python3 frensense-bench/contrib.py ledger \
              --ledger $out/previous_ledger.json --prs $out/prs.json \
              --baseline $out/previous_challenges.json --current $out/challenges.json --out $out/ledger.json
          elif [ -f $out/previous_ledger.json ]; then
            cp $out/previous_ledger.json $out/ledger.json   # no baseline to compare with: keep what is recorded
          fi

      - name: Format Benchmark Action Results
        run: |
          python3 -c "
          import json
          with open('target/blindness/blindness_report.json') as f:
              data = json.load(f)
          overall = data['overall']
          results = [
              {'name': 'Engine Blindness Rate (Unknown %)', 'value': overall['blindness_rate'], 'unit': '%'},
              {'name': 'Explored Sinks', 'value': overall['total_sinks'], 'unit': 'sinks'},
              {'name': 'Safety Valve Caps Fired', 'value': overall['truncation_caps'], 'unit': 'caps'},
              {'name': 'Peak RSS Memory', 'value': overall.get('peak_rss_mb', 0) or 0, 'unit': 'MB'},
              {'name': 'Scan Duration', 'value': overall.get('wall_s', 0), 'unit': 's'}
          ]
          with open('blindness-metrics.json', 'w') as out:
              json.dump(results, out, indent=2)
          "
          cat blindness-metrics.json

      - name: Upload Blindness Scorecards and Sheet
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frensense-blindness-profile
          path: |
            target/blindness/blindness_card.md
            target/blindness/blindness_sheet.csv
            target/blindness/blindness_history.json
            target/blindness/blindness_report.json
            target/blindness/challenges.json
            target/blindness/board.json
            target/blindness/ledger.json
            target/blindness/challenges.html
            target/blindness/challenges.md

      - name: Store and Publish Blindness Time-Series
        uses: benchmark-action/github-action-benchmark@d48d326b4ca9ba73ca0cd0d59f108f9e02a381c7 # v1.20.4
        with:
          tool: 'customSmallerIsBetter'
          output-file-path: blindness-metrics.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          benchmark-data-dir-path: 'dev/bench/blindness'
          comment-on-alert: true
          fail-on-alert: false

      - name: Stage challenge data for GitHub Pages
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p blindness-site
          # The board page lives in the docs site (/challenges) and loads board.json from here.
          # No index.html: the docs deploy owns the site pages.
          cp target/blindness/board.json blindness-site/board.json
          cp target/blindness/challenges.json blindness-site/challenges.json
          [ -f target/blindness/ledger.json ] && cp target/blindness/ledger.json blindness-site/ledger.json || true

      - name: Deploy challenge data (gh-pages /blindness)
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@329bcc8f12caed2cefe5a5b80781499a6f3b361b # v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: blindness-site
          publish_branch: gh-pages
          destination_dir: blindness
          keep_files: true
