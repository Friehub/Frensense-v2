version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
  # The docs site has its own lockfile; without this entry Dependabot only
  # looked at the repo root, where no package.json exists.
  - package-ecosystem: npm
    directory: /docs-site
    schedule:
      interval: weekly
