[workspace]
members = [
    "frensense-bundler",
    "frensense-devtools",
    "frensense-engine",
    "frensense-lang",
    "frensense-packgen",
]
resolver = "2"

# Lint contract (workspace-wide). A crate opts in with `[lints] workspace = true`.
# Every rule here is enforced by clippy/rustc, never by a hand-written counter.
# See frensense-engine/AGENTS.md for the rationale and the review-only rules.
[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
# Contract integrity: a library reports, it does not panic or print.
unwrap_used = "warn"
expect_used = "warn"
missing_panics_doc = "warn"
missing_errors_doc = "warn"
allow_attributes_without_reason = "warn"
# Structure: one responsibility per function.
too_many_lines = "warn"
implicit_clone = "warn"
needless_pass_by_value = "warn"

[package]
name = "frensense"
version = "0.8.1"
authors = ["Friehub Developers"]
edition = "2024"
description = "Frensense: deterministic dataflow security scanner."
readme = "README.md"
repository = "https://github.com/Friehub/Frensense-v2"
homepage = "https://frensense.friehub.cloud"
documentation = "https://frensense.friehub.cloud"
license = "GPL-3.0-only"
categories = ["development-tools", "security"]
keywords = ["static-analysis", "security", "dataflow", "taint-analysis"]
publish = true
rust-version = "1.95"

[lib]
name = "frensense"

[[bin]]
name = "frensense"
path = "src/bin/frensense.rs"

[dependencies]
frensense-engine = { path = "frensense-engine", version = "0.8.1", features = ["serialize"] }
frensense-lang = { path = "frensense-lang", version = "0.8.0" }
thiserror = "1.0"
tracing = { version = "0.1", features = ["attributes"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2"
rustc-hash = "1.1"

frensense-bundler = { version = "0.8.0", path = "frensense-bundler" }

[dev-dependencies]
tempfile = "3"
