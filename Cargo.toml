[workspace]
members = [
    "frensense-bundler",
    "frensense-devtools",
    "frensense-engine",
    "frensense-lang",
    "frensense-packgen",
]
resolver = "2"

[package]
name = "frensense"
version = "0.7.0-preview.5"
authors = ["Friehub Developers"]
edition = "2024"
description = "Frensense: deterministic dataflow security scanner."
readme = "README.md"
repository = "https://github.com/Friehub/Frensense-v2"
homepage = "https://frensense.friehub.cloud"
documentation = "https://frensense.friehub.cloud"
license = "GPL-3.0-only"
categories = ["development-tools", "security"]
keywords = ["static-analysis", "security", "dataflow", "taint-analysis"]
publish = true
rust-version = "1.95"

[lib]
name = "frensense"

[[bin]]
name = "frensense"
path = "src/bin/frensense.rs"

[dependencies]
frensense-engine = { path = "frensense-engine", version = "0.7.0-preview.5", features = ["serialize"] }
frensense-lang = { path = "frensense-lang", version = "0.7.0-preview.5" }
thiserror = "1.0"
tracing = { version = "0.1", features = ["attributes"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2"
rustc-hash = "1.1"

frensense-bundler = { version = "0.7.0-preview.5", path = "frensense-bundler" }

[dev-dependencies]
tempfile = "3"
