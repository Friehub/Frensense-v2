# git-cliff configuration file
# https://git-cliff.org/docs/configuration

[changelog]
# Template for the changelog header
header = """
# Changelog
All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""

# Template for the changelog body
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}
"""

# Template for the changelog footer
footer = """
<!-- generated by git-cliff -->
"""

# Remove leading and trailing whitespace from the template
trim = true

[git]
# Parse the commits based on https://www.conventionalcommits.org
conventional_commits = true
# Filter out the commits that are not conventional
filter_unconventional = false
# Process each line of a commit as an individual commit
split_commits = false
# Regex for preprocessing the commit messages
commit_preprocessors = [
    { pattern = '\((\w+\s*#\d+)\)', replace = "([$1](https://github.com/Friehub/frensense-v2/issues/$1))" },
]
# Regex for parsing and grouping commits
commit_parsers = [
    { message = "^feat\\(engine\\)", group = "Added (Engine)" },
    { message = "^feat\\(packgen\\)", group = "Added (Packgen)" },
    { message = "^feat\\(pack\\)", group = "Added (Packgen)" },
    { message = "^feat\\(bundler\\)", group = "Added (Bundler)" },
    { message = "^feat\\(lang\\)", group = "Added (Language Providers)" },
    { message = "^feat\\(cli\\)", group = "Added (CLI)" },
    { message = "^feat", group = "Added" },
    { message = "^test", group = "Added (Verification & Probes)" },
    { message = "^refactor\\(engine\\)", group = "Changed (Engine Architecture)" },
    { message = "^refactor", group = "Changed" },
    { message = "^fix", group = "Fixed" },
    { message = "^perf", group = "Performance" },
    { message = "^doc", group = "Documentation", skip = true },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore\\(deps\\)", group = "Dependencies" },
    { message = "^chore", skip = true },
    { message = ".*Phase.*done.*", skip = true },
    { message = ".*record.*plan.*", skip = true },
]
# Protect breaking changes from being skipped due to matching a skipping commit_parser
protect_breaking_commits = false
# Filter out the commits that are not matched by commit_parsers
filter_commits = false
# Regex for matching git tags
tag_pattern = "v[0-9].*"
# Regex for skipping tags
skip_tags = "beta|alpha"
# Regex for ignoring tags
ignore_tags = ""
# Sort the tags chronologically
date_order = false
# Sort the commits inside sections by oldest/newest
sort_commits = "oldest"
