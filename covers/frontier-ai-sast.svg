<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-ai-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b101b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#06090e"/>
    </linearGradient>

    <radialGradient id="glow-ai" cx="75%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#065f46" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow-agent" cx="25%" cy="70%" r="45%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#1e3a8a" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid-ai" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4"/>
    </pattern>

    <filter id="shadow-ai" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="450" fill="url(#bg-ai-grad)"/>
  <rect width="800" height="450" fill="url(#grid-ai)"/>

  <!-- Ambient Lighting -->
  <circle cx="620" cy="180" r="280" fill="url(#glow-ai)"/>
  <circle cx="200" cy="320" r="220" fill="url(#glow-agent)"/>

  <!-- Center Bridge: Frontier AI -> MCP -> Deterministic Oracle -->
  <g opacity="0.9">
    <!-- Connecting Datapath -->
    <path d="M 280 230 L 520 230" stroke="#10b981" stroke-width="3" stroke-dasharray="8,6"/>
    <polygon points="530,230 515,224 515,236" fill="#10b981"/>

    <!-- Left Box: Frontier Reasoning Agent -->
    <g transform="translate(140, 160)" filter="url(#shadow-ai)">
      <rect width="180" height="140" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.8"/>
      <rect x="16" y="16" width="36" height="36" rx="8" fill="#1e293b"/>
      <path d="M 26 34 L 34 26 L 42 34 L 34 42 Z" fill="#60a5fa"/>
      <text x="16" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Frontier Model</text>
      <text x="16" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Claude / Gemini / GLM</text>
      <text x="16" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#3b82f6">Probabilistic Reasoning</text>
    </g>

    <!-- Center Badge: MCP Protocol Server -->
    <g transform="translate(355, 205)" filter="url(#shadow-ai)">
      <rect width="90" height="50" rx="8" fill="#020617" stroke="#10b981" stroke-width="1.5"/>
      <text x="45" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#34d399">MCP</text>
      <text x="45" y="40" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#64748b">15ms RPC</text>
    </g>

    <!-- Right Box: Frensense Deterministic Oracle -->
    <g transform="translate(480, 160)" filter="url(#shadow-ai)">
      <rect width="180" height="140" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
      <rect x="16" y="16" width="36" height="36" rx="8" fill="#064e3b"/>
      <path d="M 34 24 L 44 28 L 44 38 C 44 44 34 48 34 48 C 34 48 24 44 24 38 L 24 28 Z" fill="#34d399"/>
      <text x="16" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Frensense Engine</text>
      <text x="16" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">SSA &amp; CFG Dataflow</text>
      <text x="16" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#10b981">0% False Positives</text>
    </g>
  </g>

  <!-- Title & Category Header -->
  <g transform="translate(48, 52)">
    <rect width="196" height="26" rx="13" fill="#0f172a" stroke="#1e293b" stroke-width="1.2"/>
    <circle cx="14" cy="13" r="4.5" fill="#10b981"/>
    <text x="26" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#34d399" letter-spacing="0.8">RESEARCH ESSAY</text>

    <text x="0" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">
      Static Analysis in the Era of Frontier AI
    </text>
    <text x="0" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#64748b">
      Why autonomous AI coding agents require compiler-mode deterministic verifiers
    </text>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="0" y="446" width="800" height="4" fill="#10b981"/>
</svg>
