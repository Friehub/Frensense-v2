<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070a10"/>
    </linearGradient>

    <radialGradient id="glow" cx="65%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#059669" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="node-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.5"/>
    </pattern>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.6"/>
    </filter>

    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="450" fill="url(#bg-grad)"/>

  <!-- Grid Overlay -->
  <rect width="800" height="450" fill="url(#grid)"/>

  <!-- Ambient Glow -->
  <circle cx="560" cy="200" r="260" fill="url(#glow)"/>

  <!-- Abstract SSA / CFG Flow Paths -->
  <g opacity="0.85">
    <!-- Flow Edges -->
    <path d="M 120 320 C 220 320, 260 220, 360 220" fill="none" stroke="url(#line-grad)" stroke-width="2.5" stroke-dasharray="6,4"/>
    <path d="M 360 220 C 440 220, 480 140, 560 140" fill="none" stroke="#10b981" stroke-width="2.5"/>
    <path d="M 360 220 C 440 220, 480 300, 560 300" fill="none" stroke="#10b981" stroke-width="2.5"/>
    <path d="M 560 140 C 640 140, 680 220, 720 220" fill="none" stroke="#34d399" stroke-width="2" stroke-opacity="0.7"/>
    <path d="M 560 300 C 640 300, 680 220, 720 220" fill="none" stroke="#34d399" stroke-width="2" stroke-opacity="0.7"/>

    <!-- Subtle Secondary Branches -->
    <path d="M 220 320 C 260 380, 420 390, 500 370" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4"/>
    <path d="M 360 150 C 420 110, 520 90, 620 100" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4"/>

    <!-- Graph Nodes -->
    <!-- Node 1: Entry / Source -->
    <g transform="translate(120, 320)">
      <circle r="18" fill="#0f172a" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
      <circle r="6" fill="#34d399"/>
      <text x="0" y="32" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="0.5">SOURCE</text>
    </g>

    <!-- Node 2: Intermediate Lowering -->
    <g transform="translate(360, 220)">
      <circle r="22" fill="#0f172a" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
      <circle r="8" fill="url(#node-glow)"/>
      <text x="0" y="36" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="0.5">SSA::SSA_PHI</text>
    </g>

    <!-- Node 3: Guard Branch -->
    <g transform="translate(560, 140)">
      <circle r="16" fill="#0f172a" stroke="#34d399" stroke-width="2" filter="url(#shadow)"/>
      <circle r="5" fill="#34d399"/>
      <text x="0" y="30" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="0.5">GUARD (TRUE)</text>
    </g>

    <!-- Node 4: Sanitizer -->
    <g transform="translate(560, 300)">
      <circle r="16" fill="#0f172a" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
      <circle r="5" fill="#10b981"/>
      <text x="0" y="30" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="0.5">SANITIZER</text>
    </g>

    <!-- Node 5: Sink Target -->
    <g transform="translate(720, 220)">
      <circle r="18" fill="#0f172a" stroke="#34d399" stroke-width="2" filter="url(#shadow)"/>
      <circle r="6" fill="#34d399"/>
      <text x="0" y="32" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="0.5">VERIFIED</text>
    </g>
  </g>

  <!-- Left Header Overlay: Clean Tech Badge -->
  <g transform="translate(48, 54)">
    <!-- Pill container -->
    <rect width="180" height="28" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.2"/>
    <circle cx="16" cy="14" r="4.5" fill="#10b981"/>
    <text x="28" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#34d399" letter-spacing="1">SECURITY RESEARCH</text>

    <!-- Main Title Branding -->
    <text x="0" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">
      frensense<tspan fill="#10b981">.</tspan>
    </text>
    <text x="0" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#64748b" letter-spacing="0.3">
      Deterministic Compiler-Mode Static Analysis
    </text>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="0" y="446" width="800" height="4" fill="#10b981"/>
</svg>
