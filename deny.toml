[advisories]
ignore = [
    "RUSTSEC-2025-0141", # bincode is unmaintained, but v1.3.3 is considered complete by authors
]
yanked = "warn"

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "BSD-2-Clause",
  "ISC",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "BSL-1.0",
  "Zlib",
  "GPL-3.0-only",
]
confidence-threshold = 0.8
