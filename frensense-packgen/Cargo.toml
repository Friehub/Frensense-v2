[package]
name = "frensense-packgen"
version = "0.7.0-preview.5"
license = "GPL-3.0-only"
edition = "2021"
description = "Generates the frensense default .frc pack asset from the generator-owned vocabularies"
readme = "../README.md"
repository = "https://github.com/Friehub/Frensense-v2"
homepage = "https://frensense.friehub.cloud"

[dependencies]
bincode = "1.3"
serde = { version = "1", features = ["derive"] }
frensense-lang = { version = "0.7.0-preview.5", path = "../frensense-lang" }
frensense-engine = { version = "0.7.0-preview.5", path = "../frensense-engine", features = ["serialize"] }
frensense-bundler = { version = "0.7.0-preview.5", path = "../frensense-bundler" }

[[bin]]
name = "packgen"
path = "src/main.rs"
