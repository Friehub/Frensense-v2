[package]
name = "frensense-packgen"
version = "0.8.0-beta"
license = "GPL-3.0-only"
edition = "2021"
description = "Generates the frensense default .frc pack asset from the generator-owned vocabularies"
readme = "../README.md"
repository = "https://github.com/Friehub/Frensense-v2"
homepage = "https://frensense.friehub.cloud"
# Build-time generator only: the committed asset it writes is embedded by
# frensense-bundler via include_bytes!. Never published - frensense-engine
# uses it solely as a dev-dependency (test-time pack decode), so publishing
# the engine does not require this crate on crates.io.
publish = false

[dependencies]
bincode = "1.3"
serde = { version = "1", features = ["derive"] }
frensense-lang = { version = "0.8.0-beta", path = "../frensense-lang" }
frensense-engine = { version = "0.8.0-beta", path = "../frensense-engine", features = ["serialize"] }
frensense-bundler = { version = "0.8.0-beta", path = "../frensense-bundler" }

[[bin]]
name = "packgen"
path = "src/main.rs"
